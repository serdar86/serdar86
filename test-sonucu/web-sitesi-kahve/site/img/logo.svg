<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-labelledby="logo-baslik">
  <!--
    YER TUTUCU LOGO.
    [DOLDUR: dükkân adı] - Gerçek ad belli olunca aşağıdaki text öğesindeki "Dükkân Adı" yazısını değiştirin.
    Gerçek logo ve marka rengi gelirse ([DOLDUR: logo/renk]) bu dosya tamamen değiştirilir.
    Renkler tasarım paletinden: ana #5A3825, vurgu #A8421F. Koyu temada otomatik açık tonlara geçer.
    Yazı tipi: Fraunces yüklüyse o, yoksa Georgia.
  -->
  <title id="logo-baslik">Dükkân Adı (yer tutucu logo)</title>
  <style>
    .ana { fill: #5A3825; }
    .ana-cizgi { stroke: #5A3825; }
    .vurgu { fill: #A8421F; }
    .vurgu-cizgi { stroke: #A8421F; }
    .yazi { fill: #5A3825; font-family: 'Fraunces', Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 26px; }
    @media (prefers-color-scheme: dark) {
      .ana { fill: #D9B38C; }
      .ana-cizgi { stroke: #D9B38C; }
      .vurgu { fill: #E07A52; }
      .vurgu-cizgi { stroke: #E07A52; }
      .yazi { fill: #D9B38C; }
    }
  </style>

  <!-- Fincan işareti -->
  <g transform="translate(4 8)" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- buhar -->
    <path class="vurgu-cizgi" d="M14 2c-2 3 2 5 0 8"/>
    <path class="vurgu-cizgi" d="M23 2c-2 3 2 5 0 8"/>
    <!-- fincan gövdesi ve kulp -->
    <path class="ana-cizgi" d="M6 16h26v10a10 10 0 0 1-10 10h-6A10 10 0 0 1 6 26z"/>
    <path class="ana-cizgi" d="M32 20h3a5 5 0 0 1 0 10h-4"/>
    <!-- tabak -->
    <path class="ana-cizgi" d="M4 44h30"/>
  </g>

  <!-- Ad (yer tutucu) -->
  <text class="yazi" x="56" y="30">Dükkân Adı</text>
  <text x="57" y="48" class="ana" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5">KADIKÖY · KAHVE</text>
</svg>
